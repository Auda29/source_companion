<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Source Companion</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">SC</span>
          <div>
            <h1>Source Companion</h1>
            <p>Git and GitHub source control</p>
          </div>
        </div>
        <div class="top-actions" aria-label="Repository actions">
          <button class="button primary" data-open-dialog="open">Open Repo</button>
          <button class="button" data-open-dialog="clone">Clone Repo</button>
          <button class="button" data-open-dialog="github">Clone from GitHub</button>
          <button class="button" data-open-dialog="publish">Publish to GitHub</button>
        </div>
      </header>

      <main class="layout">
        <aside class="project-picker" aria-label="Project selection">
          <div class="panel-heading">
            <h2>Recent Repositories</h2>
            <button class="icon-button" id="clearRecentButton" title="Clear recent repositories" aria-label="Clear recent repositories">x</button>
          </div>
          <div id="recentList" class="recent-list"></div>
        </aside>

        <section class="workspace" aria-label="Repository workspace">
          <nav id="tabList" class="tabs" aria-label="Open repositories"></nav>
          <div id="messageHost" class="message-host" aria-live="polite"></div>
          <div id="workspaceContent" class="workspace-content"></div>
        </section>
      </main>
    </div>

    <dialog id="openDialog" class="dialog">
      <form method="dialog" class="dialog-body" data-flow="open">
        <header>
          <h2>Open Repository</h2>
          <button class="icon-button" value="cancel" title="Close" aria-label="Close">x</button>
        </header>
        <label>
          Repository path
          <input name="path" autocomplete="off" placeholder="C:\code\project">
        </label>
        <menu>
          <button class="button" value="cancel">Cancel</button>
          <button class="button primary" value="default">Open Repo</button>
        </menu>
      </form>
    </dialog>

    <dialog id="cloneDialog" class="dialog">
      <form method="dialog" class="dialog-body" data-flow="clone">
        <header>
          <h2>Clone Repo</h2>
          <button class="icon-button" value="cancel" title="Close" aria-label="Close">x</button>
        </header>
        <label>
          Repository URL
          <input name="url" autocomplete="off" placeholder="https://github.com/owner/repo.git">
        </label>
        <label>
          Target folder
          <input name="target" autocomplete="off" placeholder="C:\code\custom-name">
        </label>
        <menu>
          <button class="button" value="cancel">Cancel</button>
          <button class="button primary" value="default">Clone Repo</button>
        </menu>
      </form>
    </dialog>

    <dialog id="githubDialog" class="dialog">
      <form method="dialog" class="dialog-body" data-flow="github">
        <header>
          <h2>Clone from GitHub</h2>
          <button class="icon-button" value="cancel" title="Close" aria-label="Close">x</button>
        </header>
        <div id="githubAuthStatus" class="github-auth-status" aria-live="polite"></div>
        <div class="github-auth-actions">
          <button class="button" type="button" data-github-auth-action="login">GitHub Login</button>
          <button class="button" type="button" data-github-auth-action="logout">Logout</button>
        </div>
        <label>
          Search repositories
          <span class="github-search-row">
            <input id="githubRepoSearch" name="query" autocomplete="off" placeholder="owner or repository">
            <button class="button" type="button" data-github-repo-search>Search</button>
          </span>
        </label>
        <div id="githubRepoList" class="github-repo-list"></div>
        <label>
          Repository name
          <input id="githubRepositoryName" name="name" autocomplete="off" placeholder="owner/repository">
        </label>
        <div id="githubSelectedUrl" class="github-selected-url"></div>
        <label>
          Target folder
          <input name="target" autocomplete="off" placeholder="C:\code\repository">
        </label>
        <menu>
          <button class="button" value="cancel">Cancel</button>
          <button class="button primary" value="default">Clone Repository</button>
        </menu>
      </form>
    </dialog>

    <dialog id="publishDialog" class="dialog">
      <form method="dialog" class="dialog-body" data-flow="publish">
        <header>
          <h2>Publish to GitHub</h2>
          <button class="icon-button" value="cancel" title="Close" aria-label="Close">x</button>
        </header>
        <label>
          Local folder
          <input name="path" autocomplete="off" placeholder="C:\code\project">
        </label>
        <label>
          Repository name
          <input name="name" autocomplete="off" placeholder="project">
        </label>
        <label>
          Description
          <input name="description" autocomplete="off" placeholder="optional repository description">
        </label>
        <fieldset class="visibility-options">
          <legend>Visibility</legend>
          <label><input type="radio" name="visibility" value="private" checked> Private</label>
          <label><input type="radio" name="visibility" value="public"> Public</label>
        </fieldset>
        <label class="checkbox-label">
          <input name="initIfNeeded" type="checkbox">
          Initialize folder with Git if needed
        </label>
        <menu>
          <button class="button" value="cancel">Cancel</button>
          <button class="button primary" value="default">Publish Repository</button>
        </menu>
      </form>
    </dialog>

    <script src="src/desktop-bridge.js"></script>
    <script src="src/github-api-client.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
