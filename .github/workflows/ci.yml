name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node tests and desktop assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install

      - name: Run Node tests and asset smoke check
        run: npm run ci:node

  tauri:
    name: Tauri Rust check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Set up Node for desktop assets
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build desktop assets for Tauri config
        run: npm run desktop:assets

      - name: Check Tauri crate
        run: cargo check
        working-directory: src-tauri
