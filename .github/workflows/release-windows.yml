name: Release Windows Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop bundle
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm install

      - name: Run Node tests and desktop asset smoke check
        run: npm run ci:node

      - name: Build Windows desktop bundle
        run: npm run desktop:build -- --bundles nsis

      - name: Collect Windows installer artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null

          $patterns = @(
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/msi/*.msi"
          )

          $artifacts = @()
          foreach ($pattern in $patterns) {
            $artifacts += Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
          }

          if ($artifacts.Count -eq 0) {
            throw "No Windows installer artifacts found under src-tauri/target/release/bundle."
          }

          foreach ($artifact in $artifacts) {
            Copy-Item -LiteralPath $artifact.FullName -Destination release-assets
          }

          Get-ChildItem -Path release-assets

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-companion-windows
          path: release-assets/*
          if-no-files-found: error

      - name: Attach Windows installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: release-assets/*
