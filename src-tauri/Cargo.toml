[package]
name = "source-companion"
version = "0.1.0"
description = "A focused Git and GitHub source-control desktop shell."
authors = ["Source Companion"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "source_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
